    enabled: true
    filePatterns:
      - AGENTS.md
      - SECURITY.md
      - GLOSSARY.md
      - docs/adr/*.md
  learnings:
    scope: local
  linked_repositories:
    - repository: IliasAlmerekov/darts
      instructions: >-
        React frontend that calls this API. Valibot schemas in src/shared/api/
        parse every response; a changed field or status breaks them.
