version: 2
updates:
  - package-ecosystem: composer
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # extra.symfony.require pins 8.1.*; a Symfony minor upgrade is done by hand.
      - dependency-name: "symfony/*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A PHP upgrade also moves composer.json and CI, so it is done by hand.
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: build
      include: scope
