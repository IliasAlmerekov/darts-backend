name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: ctype, iconv, intl, mbstring, pdo_mysql, xml, zip

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/check-test-db-env.sh
      - run: sh scripts/check-image-eol.sh

  static-analysis:
    name: PHPCS and Psalm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - run: mkdir -p build
      - run: php -d memory_limit=-1 vendor/bin/phpcs
      - run: php vendor/bin/psalm --show-info=false --report=build/psalm-quality-report.json

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:root123@127.0.0.1:3306/testphp_db?serverVersion=8.0.32&charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: testphp_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php bin/console lint:yaml -v --ansi --env=test config
      - run: php -d memory_limit=-1 bin/console cache:clear --env=test
      - run: php -d memory_limit=-1 bin/console doctrine:database:create --env=test --if-not-exists
      - run: php -d memory_limit=-1 bin/console doctrine:migrations:migrate --env=test --no-interaction
      - run: php -d memory_limit=-1 bin/console doctrine:schema:validate --env=test
      - run: php -d memory_limit=-1 vendor/bin/phpunit
