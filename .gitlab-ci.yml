###############################################################################
#
# Run quality checks and unit tests
#
test:php:
  image: ${HARBOR_REGISTRY}/library/php:${PHP_VERSION}-pcov
  stage: test
  timeout: 20m
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    APP_ENV: test
    MYSQL_ROOT_PASSWORD: root123
    MYSQL_DATABASE: testphp_db
    DATABASE_URL: "mysql://root:root123@mysql:3306/testphp_db?serverVersion=8.0.32&charset=utf8mb4"
  script:
    - cd app
    #
    - php bin/console lint:yaml -v --ansi --env=test config
    - php -d memory_limit=-1 bin/console lint:container --env=test
    - php -d memory_limit=-1 bin/console cache:clear --env=test
    - until php -r 'new PDO("mysql:host=mysql;port=3306", "root", "root123");' >/dev/null 2>&1; do sleep 1; done
    - php -d memory_limit=-1 bin/console doctrine:database:create --env=test --if-not-exists
    - php -d memory_limit=-1 bin/console doctrine:migrations:migrate --env=test --no-interaction
    - php -d memory_limit=-1 bin/console doctrine:schema:validate --env=test
    - php -d memory_limit=-1 vendor/bin/phpunit --coverage-text  --coverage-clover build/phpunit.coverage.xml --coverage-cobertura build/phpunit.coverage.cobertura.xml --log-junit build/phpunit.xml
  needs:
    - job: build:php
      artifacts: true
  artifacts:
    when: always
    #    expire_in: 1 day
    #    paths:
    #      - app/build/
    reports:
      # https://docs.gitlab.com/ci/testing/code_coverage/cobertura/#php-example
      coverage_report:
        coverage_format: cobertura
        path: app/build/phpunit.coverage.cobertura.xml
      # https://docs.gitlab.com/ci/testing/unit_test_report_examples/#php
      junit: app/build/phpunit.xml

test:dev-env:
  image: ${HARBOR_REGISTRY}/library/php:${PHP_VERSION}
  stage: test
  script:
    - sh scripts/check-test-db-env.sh
  needs: []

test:line-endings:
  # The -dev image ships git, which the check needs for .gitattributes lookups.
  image: ${HARBOR_REGISTRY}/library/php:${PHP_VERSION}-dev
  stage: test
  script:
    - sh scripts/check-image-eol.sh
    - sh scripts/check-gitlab-dockerfiles.sh
    - sh scripts/test-ci-checks.sh
    - bash scripts/check-secrets.sh
  needs: []

test:codesniffer:
  image: ${HARBOR_REGISTRY}/library/php:${PHP_VERSION}-dev
  stage: test
  script:
    - cd app
    - php -d memory_limit=-1 vendor/bin/phpcs
    - sed -i -e 's#/builds/deepblue/darts/backend/app/src#app/src#g' build/phpcs-quality-report.json
  needs:
    - job: build:php
      artifacts: true
  artifacts:
    when: always
    reports:
      codequality: app/build/phpcs-quality-report.json

test:static-analysis:
  image: ${HARBOR_REGISTRY}/library/php:${PHP_VERSION}-dev
  stage: test
  #  allow_failure: true
  script:
    - cd app
    - php bin/console cache:warmup --env=dev
    - php vendor/bin/psalm --show-info=false --report=build/psalm-quality-report.json
    - sed -i -e 's#\/builds\/deepblue\/darts\/backend\/app\/src#app\/src#g' build/psalm-quality-report.json
  needs:
    - job: build:php
      artifacts: true
  artifacts:
    when: always
    reports:
      codequality: app/build/psalm-quality-report.json

###############################################################################
#
# Build Docker Images
#
docker:build:php:
  stage: build-docker
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:${DOCKER_VERSION}
  # Never cancel a half-pushed image.
  interruptible: false
  tags:
    - docker
  before_script: *docker_login
  script:
    - docker build --label ref_name=${CI_COMMIT_REF_NAME} -f app/Dockerfile --target runtime -t ${HARBOR_REGISTRY_PREFIX}/php:${CI_COMMIT_REF_NAME} .
    - docker push ${HARBOR_REGISTRY_PREFIX}/php:${CI_COMMIT_REF_NAME}
  needs:
    - job: build:php
      artifacts: true
  #    - job: build:assets
  #      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(rc|dev|hotfix).*)?$/'
      when: always
    - when: never
