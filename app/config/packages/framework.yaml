# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: "%env(APP_SECRET)%"
    error_controller: App\Security\ErrorController::show
    trusted_proxies: "%env(default::SYMFONY_TRUSTED_PROXIES)%"
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@prod:
    parameters:
        # Plain APP_SECRET still works when no secret file is mounted.
        app.secret_from_env: '%env(APP_SECRET)%'
    framework:
        # Read at runtime, so FPM, `docker compose run` and `docker compose exec` all see it
        # without an entrypoint exporting secrets into the process environment.
        secret: '%env(default:app.secret_from_env:trim:file:APP_SECRET_FILE)%'
        session:
            # Sessions survive container restarts when var/sessions is a volume.
            handler_id: session.handler.native_file
            save_path: '%kernel.project_dir%/var/sessions'
            cookie_secure: true
            cookie_samesite: lax
