security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            stateless: true
            provider: app_user_provider
            entry_point: App\Security\ApiAuthenticationEntryPoint
            jwt: ~

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/csrf, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/invite/join, roles: PUBLIC_ACCESS }
        - { path: /api/room/waiting, roles: ROLE_PLAYER }
        - { path: ^/api/room, roles: ROLE_ADMIN }
        - { path: ^/api/invite/create/, roles: ROLE_ADMIN }
        - { path: ^/api/game, roles: [ROLE_PLAYER, ROLE_ADMIN] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
