# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    frontend_url: "%env(string:FRONTEND_URL)%"
    # Seconds a player stays logged in after the last visit (docs/adr/0002-player-remembered-login.md).
    app.remembered_login.lifetime: 604800

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"

    App\Repository\RoundRepositoryInterface: '@App\Repository\RoundRepository'
    App\Repository\RoundThrowsRepositoryInterface: '@App\Repository\RoundThrowsRepository'
    App\Repository\GamePlayersRepositoryInterface: '@App\Repository\GamePlayersRepository'
    App\Repository\GameRepositoryInterface: '@App\Repository\GameRepository'
    App\Repository\InvitationRepositoryInterface: '@App\Repository\InvitationRepository'
    App\Repository\PlayerStatsRepositoryInterface: '@App\Repository\PlayerStatsRepository'
    App\Repository\UserRepositoryInterface: '@App\Repository\UserRepository'
    App\EventSubscriber\RememberedLoginCookieSubscriber:
        arguments:
            $cookieName: REMEMBERME
            $lifetime: "%app.remembered_login.lifetime%"
    App\Security\RememberedLoginTokenPurger:
        arguments:
            $lifetime: "%app.remembered_login.lifetime%"
    App\EventSubscriber\RememberedLoginRefreshSubscriber:
        arguments:
            $rememberMeHandler: '@security.authenticator.remember_me_handler.main'
            $cookieName: REMEMBERME
    App\Controller\InvitationController:
        arguments:
            $frontendUrl: "%frontend_url%"
    App\Service\Invitation\InvitationServiceInterface: '@App\Service\Invitation\InvitationService'
    App\Service\Invitation\InvitationService:
        arguments:
            $frontendUrl: "%frontend_url%"
    App\Service\Registration\RegistrationServiceInterface: '@App\Service\Registration\RegistrationService'
    App\Service\Security\SecurityServiceInterface: '@App\Service\Security\SecurityService'
    App\Service\Security\SecurityService:
        arguments:
            $frontendUrl: "%frontend_url%"
    App\Service\Security\GameAccessServiceInterface: '@App\Service\Security\GameAccessService'
    App\Service\Game\GameStartServiceInterface: '@App\Service\Game\GameStartService'
    App\Service\Game\GameSettingsServiceInterface: '@App\Service\Game\GameSettingsService'
    App\Service\Game\GameRoomServiceInterface: '@App\Service\Game\GameRoomService'
    App\Service\Game\GameThrowServiceInterface: '@App\Service\Game\GameThrowService'
    App\Service\Game\GameServiceInterface: '@App\Service\Game\GameService'
    App\Service\Game\ActivePlayerResolverInterface: '@App\Service\Game\ActivePlayerResolver'
    App\Service\Game\GameStateVersionServiceInterface: '@App\Service\Game\GameStateVersionService'
    App\Service\Game\GameDeltaServiceInterface: '@App\Service\Game\GameDeltaService'
    App\Service\Game\GameStatisticsServiceInterface: '@App\Service\Game\GameStatisticsService'
    App\Service\Game\GameFinishServiceInterface: '@App\Service\Game\GameFinishService'
    App\Service\Game\GameReopenServiceInterface: '@App\Service\Game\GameReopenService'
    App\Service\Game\GameAbortServiceInterface: '@App\Service\Game\GameAbortService'
    App\Service\Game\RematchServiceInterface: '@App\Service\Game\RematchService'
    App\Service\Player\PlayerManagementServiceInterface: '@App\Service\Player\PlayerManagementService'
    App\Service\Player\GuestPlayerServiceInterface: '@App\Service\Player\GuestPlayerService'
    App\Service\Sse\SseStreamServiceInterface: '@App\Service\Sse\SseStreamService'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Same as cache.adapter.array, but without the reset tag. The kernel resets services
        # after every request, which would empty the limiter between two requests of one test.
        # Each booted kernel still starts with an empty pool, so state never leaks between tests.
        app.cache.adapter.in_memory:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter
            abstract: true
            arguments: [0]
            tags:
                - { name: cache.pool, clearer: cache.default_clearer }
