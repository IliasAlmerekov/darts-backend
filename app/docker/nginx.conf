# Main nginx configuration for an unprivileged container: no user switch,
# runtime files under /tmp, logs on the container streams.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 2m;

    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Rendered from default.conf.template by start-container.
    include /tmp/nginx/default.conf;
}
