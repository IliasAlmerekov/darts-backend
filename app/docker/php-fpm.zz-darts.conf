; Loaded after the image's docker.conf and www.conf, so these values win.
; FPM runs as the unprivileged image user, so no user/group switch is configured.
[www]
listen = 127.0.0.1:9000
; nginx already logs every request.
access.log = /dev/null

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Workers start on demand and exit when idle, so an idle container stays small.
; Every open SSE stream holds one worker until the client disconnects.
pm = ondemand
pm.max_children = 14
pm.process_idle_timeout = 30s
pm.max_requests = 500
