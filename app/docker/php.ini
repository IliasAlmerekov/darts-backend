; Production PHP settings for the runtime image (FPM and CLI). Loaded after php.ini-production,
; so everything here wins; php.ini-production sets neither html_errors nor use_strict_mode.
memory_limit = 64M
expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
zend.assertions = -1
session.use_strict_mode = On
log_errors = On
error_log = /proc/self/fd/2
; SSE responses must reach the client as soon as they are written.
output_buffering = Off
zlib.output_compression = Off
; CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp): upload progress reads session state before
; request startup. The API takes no file uploads, so the feature stays off after the patch too.
session.upload_progress.enabled = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
; Code and the warmed container never change inside a running image.
opcache.validate_timestamps = 0
