upstream _php {
    server unix:/var/run/php-fpm.socket;
}
server {
        listen 80;
        server_name localhost;
        root /var/www/html/public;
        index index.php index.html;

        location / {
            try_files $uri $uri/  /index.php?$query_string;
        }

        # Only the front controller runs PHP, reached through the try_files fallback above.
        # Same rule as the production template, app/docker/nginx.conf.template.
        location ~ ^/index\.php(/|$) {
            fastcgi_pass _php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        # Any other *.php path, existing file or not, never reaches PHP-FPM.
        location ~ \.php$ {
            return 404;
        }
}
