[build]
dockerfilePath = "app/Dockerfile"
watchPatterns = ["app/**"]

[deploy]
startCommand = "/usr/local/bin/start-container"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
preDeployCommand = "echo DATABASE_URL=$DATABASE_URL && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration"
